<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
  <style>
    body { margin: 0; background: #080908; font-family: 'Share Tech Mono', 'MS Gothic', 'Yu Gothic', 'Noto Sans JP', monospace; }
    a { color: #ff2d2d; } a:hover { color: #ff9d9d; }
    .col { position: absolute; top: 0; height: 440px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; will-change: transform; }
    .strand { white-space: pre; font-size: 17px; line-height: 21px; text-align: center; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 42%, rgba(0,0,0,1) 100%); mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 42%, rgba(0,0,0,1) 100%); }
    .head { font-size: 17px; line-height: 21px; }
    .cellbig { position: relative; width: 44px; height: 76px; overflow: hidden; }
    .stripbig { position: absolute; left: 0; top: 0; width: 44px; white-space: pre; font-size: 80px; line-height: 76px; text-align: center; will-change: transform; }
    .cellsec { position: relative; width: 16px; height: 30px; overflow: hidden; }
    .stripsec { position: absolute; left: 0; top: 0; width: 16px; white-space: pre; font-size: 28px; line-height: 30px; text-align: center; will-change: transform; }
    .cellsm { position: relative; width: 13px; height: 26px; overflow: hidden; }
    .stripsm { position: absolute; left: 0; top: 0; width: 13px; white-space: pre; font-size: 22px; line-height: 26px; text-align: center; will-change: transform; }
    .seam { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, 0.55); pointer-events: none; }
    .scanlines { position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px); pointer-events: none; }
    .roll { position: absolute; left: 0; width: 100%; height: 120px; background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,215,215,0.05) 50%, rgba(255,255,255,0) 100%); animation: roll 7s linear infinite; pointer-events: none; }
    @keyframes fall { from { transform: translateY(-460px); } to { transform: translateY(520px); } }
    @keyframes roll { from { top: -140px; } to { top: 480px; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
</helmet>
<div style="width: 520px; height: 520px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 28%, #2b2f2d 0%, #161918 55%, #070807 100%);">
  <div style="position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; background: #000000; box-shadow: inset 0 0 0 2px #191c1b;">

    <div style="position: absolute; inset: 0; color: {{dim}}; filter: blur(0.4px);">
      <sc-for list="{{cols}}" as="col" hint-placeholder-count="16">
        <div class="col" style="left: {{col.left}}px; animation-duration: {{col.dur}}s; animation-delay: {{col.delay}}s; opacity: {{col.op}};">
          <span class="strand">{{col.text}}</span>
          <span class="head" style="color: {{headC}}; text-shadow: 0 0 14px {{accent}};">{{col.head}}</span>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 44% 40% at 50% 50%, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.84) 52%, rgba(0,0,0,0) 100%);"></div>

    <div style="position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-size: 22px; letter-spacing: 2px; color: {{labelC}};">&gt; SYS.TIME</div>

    <div style="position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; justify-content: center;">
      <div style="position: relative; display: flex; align-items: flex-start; color: {{bright}}; text-shadow: 0 0 6px {{glow1}}, 0 0 26px {{glow1}}, 0 0 54px {{glow2}}, 1.5px 0 0 {{bleed}};">
        <sc-for list="{{hh}}" as="d" hint-placeholder-count="2">
          <div class="cellbig"><div class="stripbig" style="transform: translateY({{d.y}}px); transition: {{d.trans}};">{{d.text}}</div><div class="seam"></div></div>
        </sc-for>
        <div style="width: 24px; height: 76px; font-size: 80px; line-height: 76px; text-align: center;">:</div>
        <sc-for list="{{mm}}" as="d" hint-placeholder-count="2">
          <div class="cellbig"><div class="stripbig" style="transform: translateY({{d.y}}px); transition: {{d.trans}};">{{d.text}}</div><div class="seam"></div></div>
        </sc-for>
        <div style="position: absolute; left: 100%; bottom: 6px; padding-left: 12px; display: flex; align-items: flex-end; gap: 8px;">
          <div style="display: flex; color: {{secC}}; text-shadow: 0 0 12px {{glow2}};">
            <sc-for list="{{ss}}" as="d" hint-placeholder-count="2">
              <div class="cellsec"><div class="stripsec" style="transform: translateY({{d.y}}px); transition: {{d.trans}};">{{d.text}}</div><div class="seam"></div></div>
            </sc-for>
          </div>
          <div style="width: 10px; height: 26px; background: {{bright}}; box-shadow: 0 0 12px {{glow1}}; animation: blink 1.1s steps(1, end) infinite;"></div>
        </div>
      </div>
    </div>

    <div style="position: absolute; left: 110px; top: 296px; width: 260px; height: 1px; background: {{ruleC}};"></div>

    <div style="position: absolute; left: 0; right: 0; top: 308px; display: flex; justify-content: center;">
      <div style="display: grid; grid-template-columns: 96px auto; gap: 6px 0; font-size: 22px; line-height: 26px; letter-spacing: 1px; color: {{valueC}}; text-shadow: 0 0 10px {{glow2}};">
        <span style="color: {{labelC}};">DATE</span>
        <span>THU 10 SEP</span>
        <span style="color: {{labelC}};">STEPS</span>
        <span style="display: flex;">
          <sc-for list="{{steps}}" as="d" hint-placeholder-count="4">
            <span class="cellsm"><span class="stripsm" style="transform: translateY({{d.y}}px); transition: {{d.trans}};">{{d.text}}</span><span class="seam"></span></span>
          </sc-for>
        </span>
        <span style="color: {{labelC}};">HR</span>
        <span style="display: flex;">
          <sc-for list="{{hr}}" as="d" hint-placeholder-count="2">
            <span class="cellsm"><span class="stripsm" style="transform: translateY({{d.y}}px); transition: {{d.trans}};">{{d.text}}</span><span class="seam"></span></span>
          </sc-for>
          <span style="padding-left: 8px;">BPM</span>
        </span>
        <span style="color: {{labelC}};">PWR</span>
        <span style="display: flex;">
          <sc-for list="{{pwr}}" as="d" hint-placeholder-count="2">
            <span class="cellsm"><span class="stripsm" style="transform: translateY({{d.y}}px); transition: {{d.trans}};">{{d.text}}</span><span class="seam"></span></span>
          </sc-for>
          <span>%</span>
        </span>
      </div>
    </div>

    <div class="roll"></div>
    <div class="scanlines"></div>
    <div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgba(255,150,150,0.05) 0%, rgba(0,0,0,0) 55%), radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.72) 100%); pointer-events: none;"></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":520,"height":520},"accent":{"editor":"color","default":"#ff2d2d","options":["#ff2d2d","#ff6b6b","#ff8b3d","#ff2d8b"]},"density":{"editor":"int","default":48,"min":8,"max":64},"speed":{"editor":"range","default":1.5,"min":0.3,"max":3,"step":0.1}}'>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () { self.step(); }, 1000);
  }

  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
    if (this.settle) clearTimeout(this.settle);
  }

  valuesAt(t) {
    var secs = 10 * 3600 + 9 * 60 + 36 + t;
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var wob = [0, 1, -1, 2, -2, 1, 0, -1];
    return {
      h: pad(Math.floor(secs / 3600) % 24),
      m: pad(Math.floor(secs / 60) % 60),
      s: pad(secs % 60),
      steps: String(8670 + Math.floor(t / 4) * 7),
      hr: String(86 + wob[Math.floor(t / 5) % 8]),
      pwr: '87'
    };
  }

  slots(v) {
    return [['h', v.h], ['m', v.m], ['s', v.s], ['st', v.steps], ['hr', v.hr], ['pw', v.pwr]];
  }

  step() {
    var s = this.state || {};
    var t = (s.t || 0) + 1;
    var old = s.pos || {};
    var vals = this.valuesAt(t);
    var slots = this.slots(vals);
    var pre = {};
    var tr = {};
    var moves = [];
    for (var a = 0; a < slots.length; a++) {
      var name = slots[a][0];
      var str = slots[a][1];
      for (var i = 0; i < str.length; i++) {
        var id = name + i;
        var d = parseInt(str.charAt(i), 10);
        var p = old[id];
        if (p === undefined || isNaN(p)) p = d;
        if (p >= 10) p -= 10;
        var delta = (d - (p % 10) + 10) % 10;
        pre[id] = p;
        tr[id] = 'none';
        if (delta > 0) moves.push([id, p + delta]);
      }
    }
    this.setState({ t: t, pos: pre, trans: tr });
    var self = this;
    if (this.settle) clearTimeout(this.settle);
    this.settle = setTimeout(function () {
      var cur = (self.state || {}).pos || {};
      var np = {};
      var nt = {};
      for (var k in cur) { np[k] = cur[k]; }
      for (var j = 0; j < moves.length; j++) { np[moves[j][0]] = moves[j][1]; }
      for (var k2 in np) { nt[k2] = 'transform 0.5s cubic-bezier(0.2, 0.75, 0.2, 1)'; }
      self.setState({ pos: np, trans: nt });
    }, 40);
  }

  renderVals() {
    var accent = this.props.accent || '#ff2d2d';
    var density = this.props.density || 48;
    var speed = this.props.speed || 1.5;
    var s = this.state || {};
    var pos = s.pos || {};
    var trans = s.trans || {};
    var vals = this.valuesAt(s.t || 0);

    var G = [];
    for (var c = 0xff66; c <= 0xff9d; c++) G.push(String.fromCharCode(c));
    G = G.concat('0123456789=+*'.split(''));
    function rnd(sd) { var x = Math.sin(sd * 88.3) * 24917.7713; return x - Math.floor(x); }
    function rgba(hex, a) {
      var h = String(hex).replace('#', '');
      if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
      var n = parseInt(h, 16);
      if (isNaN(n)) n = 0xff2d2d;
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }

    var strip = '';
    for (var q = 0; q < 20; q++) strip += (q % 10) + (q < 19 ? '\n' : '');

    function cells(name, str, itemH) {
      var out = [];
      for (var i = 0; i < str.length; i++) {
        var id = name + i;
        var d = parseInt(str.charAt(i), 10);
        var p = pos[id];
        if (p === undefined || isNaN(p)) p = d;
        out.push({ y: -(p * itemH), trans: trans[id] || 'none', text: strip });
      }
      return out;
    }

    var cols = [];
    var stepX = 480 / density;
    for (var i2 = 0; i2 < density; i2++) {
      var len = 9 + Math.floor(rnd(i2 + 1) * 12);
      var tt = [];
      for (var j = 0; j < len; j++) tt.push(G[Math.floor(rnd(i2 * 27.1 + j * 7.7 + 4) * G.length)]);
      cols.push({
        left: Math.round(i2 * stepX + (rnd(i2 + 9) - 0.5) * stepX * 0.4),
        text: tt.join('\n'),
        head: G[Math.floor(rnd(i2 * 5.9 + 21) * G.length)],
        dur: Math.round((5.5 + rnd(i2 + 5) * 8) / speed * 10) / 10,
        delay: -Math.round(rnd(i2 + 2) * 130) / 10,
        op: Math.round((0.4 + rnd(i2 + 7) * 0.5) * 100) / 100
      });
    }

    return {
      accent: accent,
      bright: '#ffd9d9',
      dim: rgba(accent, 0.62),
      headC: '#fff0f0',
      labelC: rgba(accent, 0.45),
      valueC: rgba(accent, 0.95),
      secC: rgba(accent, 0.75),
      ruleC: rgba(accent, 0.3),
      glow1: rgba(accent, 0.75),
      glow2: rgba(accent, 0.4),
      bleed: 'rgba(0,190,255,0.35)',
      cols: cols,
      hh: cells('h', vals.h, 76),
      mm: cells('m', vals.m, 76),
      ss: cells('s', vals.s, 30),
      steps: cells('st', vals.steps, 26),
      hr: cells('hr', vals.hr, 26),
      pwr: cells('pw', vals.pwr, 26)
    };
  }
}
</script>
</body>
</html>
