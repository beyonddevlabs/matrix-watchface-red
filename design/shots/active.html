<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Matrix Watchface - active</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500&display=swap">
<style>
  html, body { margin: 0; background: #080908; }
  body { width: 520px; height: 520px; overflow: hidden; font-family: 'Chakra Petch', 'Arial Narrow', sans-serif; }
  .bezel { width: 520px; height: 520px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 28%, #2b2f2d 0%, #161918 55%, #070807 100%); }
  .screen { position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; background: #000; box-shadow: inset 0 0 0 2px #191c1b; }
  .rain { position: absolute; inset: 0; font-family: 'MS Gothic', 'Yu Gothic', monospace; color: rgba(255,45,45,0.62); filter: blur(0.4px); }
  .col { position: absolute; top: 0; height: 440px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .strand { white-space: pre; font-size: 17px; line-height: 21px; text-align: center; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 42%, rgba(0,0,0,1) 100%); }
  .head { font-size: 17px; line-height: 21px; color: #fff0f0; text-shadow: 0 0 14px #ff2d2d; }
  .scrim { position: absolute; inset: 0; background: radial-gradient(ellipse 44% 40% at 50% 50%, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.84) 52%, rgba(0,0,0,0) 100%); }
  .label { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-size: 22px; letter-spacing: 2px; color: rgba(255,45,45,0.45); }
  .timewrap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; justify-content: center; }
  .time { position: relative; display: flex; align-items: flex-start; color: #ffd9d9; text-shadow: 0 0 6px rgba(255,45,45,0.75), 0 0 26px rgba(255,45,45,0.75), 0 0 54px rgba(255,45,45,0.4), 1.5px 0 0 rgba(0,190,255,0.35); }
  .cellbig { position: relative; width: 51px; height: 76px; overflow: hidden; }
  .stripbig { position: absolute; left: 0; top: 0; width: 51px; white-space: pre; font-size: 80px; line-height: 76px; text-align: center; }
  .colon { width: 20px; height: 76px; font-size: 80px; line-height: 76px; text-align: center; }
  .secwrap { position: absolute; left: 100%; bottom: 6px; padding-left: 12px; display: flex; align-items: flex-end; gap: 8px; }
  .sec { display: flex; color: rgba(255,45,45,0.75); text-shadow: 0 0 12px rgba(255,45,45,0.4); }
  .cellsec { position: relative; width: 18px; height: 30px; overflow: hidden; }
  .stripsec { position: absolute; left: 0; top: 0; width: 18px; white-space: pre; font-size: 28px; line-height: 30px; text-align: center; }
  .cursor { width: 10px; height: 26px; background: #ffd9d9; box-shadow: 0 0 12px rgba(255,45,45,0.75); }
  .seam { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,0.55); }
  .rule { position: absolute; left: 110px; top: 296px; width: 260px; height: 1px; background: rgba(255,45,45,0.3); }
  .gridwrap { position: absolute; left: 0; right: 0; top: 308px; display: flex; justify-content: center; }
  .grid { display: grid; grid-template-columns: 96px auto; gap: 6px 0; font-size: 22px; line-height: 26px; letter-spacing: 1px; color: rgba(255,45,45,0.95); text-shadow: 0 0 10px rgba(255,45,45,0.4); }
  .lbl { color: rgba(255,45,45,0.45); }
  .num { display: flex; }
  .cellsm { position: relative; width: 14px; height: 26px; overflow: hidden; }
  .stripsm { position: absolute; left: 0; top: 0; width: 14px; white-space: pre; font-size: 22px; line-height: 26px; text-align: center; }
  .rollband { position: absolute; left: 0; top: 168px; width: 100%; height: 120px; background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,215,215,0.05) 50%, rgba(255,255,255,0) 100%); }
  .scanlines { position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgba(255,150,150,0.05) 0%, rgba(0,0,0,0) 55%), radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.72) 100%); }
</style>
</head>
<body>
<div class="bezel"><div class="screen">
  <div class="rain" id="rain"></div>
  <div class="scrim"></div>
  <div class="label">&gt; SYS.TIME</div>
  <div class="timewrap"><div class="time" id="time"></div></div>
  <div class="rule"></div>
  <div class="gridwrap"><div class="grid" id="grid"></div></div>
  <div class="rollband"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>
</div></div>
<script>
var G = [];
for (var c = 0xff66; c <= 0xff9d; c++) G.push(String.fromCharCode(c));
G = G.concat('0123456789=+*'.split(''));
function rnd(s) { var x = Math.sin(s * 88.3) * 24917.7713; return x - Math.floor(x); }

// Rain, frozen at the position each column holds at t = 0.
var density = 48, speed = 1.5, stepX = 480 / density, html = '';
for (var i = 0; i < density; i++) {
  var len = 9 + Math.floor(rnd(i + 1) * 12), t = [];
  for (var j = 0; j < len; j++) t.push(G[Math.floor(rnd(i * 27.1 + j * 7.7 + 4) * G.length)]);
  var dur = (5.5 + rnd(i + 5) * 8) / speed;
  var delay = rnd(i + 2) * 13;
  var p = (delay % dur) / dur;
  html += '<div class="col" style="left:' + Math.round(i * stepX + (rnd(i + 9) - 0.5) * stepX * 0.4) + 'px;'
    + 'opacity:' + (0.4 + rnd(i + 7) * 0.5).toFixed(2) + ';'
    + 'transform:translateY(' + Math.round(-460 + p * 980) + 'px)">'
    + '<span class="strand">' + t.join('\n') + '</span>'
    + '<span class="head">' + G[Math.floor(rnd(i * 5.9 + 21) * G.length)] + '</span></div>';
}
document.getElementById('rain').innerHTML = html;

var strip = '';
for (var q = 0; q < 20; q++) strip += (q % 10) + (q < 19 ? '\n' : '');

// The flap edge belongs to the flap effect and is only shown with ?flap.
var flap = location.search.indexOf('flap') >= 0;

function cell(cls, stripCls, d, h, offset) {
  return '<div class="' + cls + '"><div class="' + stripCls + '" style="transform:translateY('
    + (-(d * h) - (offset || 0)) + 'px)">' + strip + '</div>'
    + (flap ? '<div class="seam"></div>' : '') + '</div>';
}

// 10:09:36 - the sample time the Zepp OS preview spec asks for. With ?flap the
// minute digit is caught mid-roll, which is what the flap looks like.
var flap = location.search.indexOf('flap') >= 0;

// ?icon drops the bezel ring, so the shot is exactly the 480 x 480 panel -
// that is what app.json wants as icon.png.
if (location.search.indexOf('icon') >= 0) {
  document.body.style.width = '480px';
  document.body.style.height = '480px';
  var bezel = document.querySelector('.bezel');
  bezel.style.width = '480px';
  bezel.style.height = '480px';
  bezel.style.background = '#000';
}
var time = cell('cellbig', 'stripbig', 1, 76) + cell('cellbig', 'stripbig', 0, 76)
  + '<div class="colon">:</div>'
  + cell('cellbig', 'stripbig', 0, 76) + cell('cellbig', 'stripbig', 9, 76, flap ? 40 : 0)
  + '<div class="secwrap"><div class="sec">'
  + cell('cellsec', 'stripsec', 3, 30) + cell('cellsec', 'stripsec', 6, 30)
  + '</div><div class="cursor"></div></div>';
document.getElementById('time').innerHTML = time;

function num(value, pad) {
  var s = String(value), out = '';
  for (var i = 0; i < s.length; i++) out += cell('cellsm', 'stripsm', +s.charAt(i), 26);
  return '<span class="num">' + out + (pad || '') + '</span>';
}
// ?preview=1 switches to the values the Zepp OS specification prescribes for
// the store preview image: battery 75 %, date in February or August.
var storePreview = location.search.indexOf('preview') >= 0;
var dateText = storePreview ? 'WED 12 AUG' : 'THU 10 SEP';
var power = storePreview ? 75 : 87;

document.getElementById('grid').innerHTML =
  '<span class="lbl">DATE</span><span>' + dateText + '</span>'
  + '<span class="lbl">STEPS</span>' + num(8670)
  + '<span class="lbl">HR</span>' + num(86, '<span style="padding-left:8px">BPM</span>')
  + '<span class="lbl">PWR</span>' + num(power, '<span>%</span>');
</script>
</body>
</html>
