<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
  <style>
    body { margin: 0; background: #080908; font-family: 'Share Tech Mono', 'MS Gothic', 'Yu Gothic', 'Noto Sans JP', monospace; }
    a { color: #ff2d2d; } a:hover { color: #ff9d9d; }
    .col { position: absolute; top: 0; height: 440px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; will-change: transform; }
    .strand { white-space: pre; font-size: 17px; line-height: 21px; text-align: center; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 42%, rgba(0,0,0,1) 100%); mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 42%, rgba(0,0,0,1) 100%); }
    .head { font-size: 17px; line-height: 21px; }
    @keyframes fall { from { transform: translateY(-460px); } to { transform: translateY(520px); } }
    @keyframes drip { 0%, 100% { opacity: 1; transform: translateY(0); } 50% { opacity: 0.55; transform: translateY(3px); } }
  </style>
</helmet>
<div style="width: 520px; height: 520px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 28%, #2b2f2d 0%, #161918 55%, #070807 100%);">
  <div style="position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; background: #000000; box-shadow: inset 0 0 0 2px #191c1b;">
    <div style="position: absolute; inset: 0; color: {{dim}};">
      <sc-for list="{{cols}}" as="col" hint-placeholder-count="12">
        <div class="col" style="left: {{col.left}}px; animation-duration: {{col.dur}}s; animation-delay: {{col.delay}}s; opacity: {{col.op}};">
          <span class="strand">{{col.text}}</span>
          <span class="head" style="color: {{headC}}; text-shadow: 0 0 12px {{accent}};">{{col.head}}</span>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 50%; top: 0; width: 190px; height: 480px; transform: translateX(-95px); background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.9) 60%, rgba(0,0,0,0.55) 100%); -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, #000 22%, #000 78%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, #000 22%, #000 78%, rgba(0,0,0,0) 100%);"></div>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 44px 0;">
      <div style="white-space: pre; font-size: 17px; line-height: 21px; text-align: center; color: {{tailC}}; margin-bottom: 2px;">{{tail}}</div>
      <div style="font-size: 116px; line-height: 0.88; letter-spacing: 2px; color: {{accent}}; text-shadow: 0 0 16px {{glow1}}, 0 0 46px {{glow2}};">10</div>
      <div style="font-size: 116px; line-height: 0.88; letter-spacing: 2px; color: {{accent}}; text-shadow: 0 0 16px {{glow1}}, 0 0 46px {{glow2}};">09</div>
      <div style="font-size: 26px; line-height: 30px; color: #fff2f2; text-shadow: 0 0 14px {{accent}}; margin-top: 0; animation: drip 2.4s ease-in-out infinite;">{{dropGlyph}}</div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 52px; display: flex; justify-content: center; gap: 18px; font-size: 24px; letter-spacing: 1px;">
      <span style="color: {{valueC}};">THU 10 SEP</span>
      <span style="color: {{labelC}};">|</span>
      <span style="color: {{valueC}};">8670</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":520,"height":520},"accent":{"editor":"color","default":"#ff2d2d","options":["#ff2d2d","#ff6b6b","#ff8b3d","#ff2d8b"]},"density":{"editor":"int","default":30,"min":8,"max":48},"speed":{"editor":"range","default":1,"min":0.3,"max":2.5,"step":0.1}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent || '#ff2d2d';
    var density = this.props.density || 30;
    var speed = this.props.speed || 1;
    var G = [];
    for (var c = 0xff66; c <= 0xff9d; c++) G.push(String.fromCharCode(c));
    G = G.concat('0123456789=+*'.split(''));
    function rnd(s) { var x = Math.sin(s * 71.9) * 19273.5527; return x - Math.floor(x); }
    function rgba(hex, a) {
      var h = String(hex).replace('#', '');
      if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
      var n = parseInt(h, 16);
      if (isNaN(n)) n = 0xff2d2d;
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }
    var cols = [];
    var step = 480 / density;
    for (var i = 0; i < density; i++) {
      var len = 9 + Math.floor(rnd(i + 1) * 12);
      var t = [];
      for (var j = 0; j < len; j++) t.push(G[Math.floor(rnd(i * 29.3 + j * 6.1 + 8) * G.length)]);
      cols.push({
        left: Math.round(i * step + (rnd(i + 9) - 0.5) * step * 0.4),
        text: t.join('\n'),
        head: G[Math.floor(rnd(i * 9.3 + 27) * G.length)],
        dur: Math.round((5.5 + rnd(i + 5) * 8) / speed * 10) / 10,
        delay: -Math.round(rnd(i + 2) * 130) / 10,
        op: Math.round((0.4 + rnd(i + 7) * 0.5) * 100) / 100
      });
    }
    var tail = [];
    for (var k = 0; k < 3; k++) tail.push(G[Math.floor(rnd(k * 11.3 + 31) * G.length)]);
    return {
      accent: accent,
      dim: rgba(accent, 0.72),
      headC: '#fff0f0',
      tailC: rgba(accent, 0.4),
      labelC: rgba(accent, 0.35),
      valueC: rgba(accent, 0.9),
      glow1: rgba(accent, 0.8),
      glow2: rgba(accent, 0.4),
      tail: tail.join('\n'),
      dropGlyph: G[Math.floor(rnd(41) * G.length)],
      cols: cols
    };
  }
}
</script>
</body>
</html>
