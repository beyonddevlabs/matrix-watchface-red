<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
  <style>
    body { margin: 0; background: #080908; font-family: 'Share Tech Mono', 'MS Gothic', 'Yu Gothic', 'Noto Sans JP', monospace; }
    a { color: #ff2d2d; } a:hover { color: #ff9d9d; }
    .col { position: absolute; top: 0; height: 440px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; will-change: transform; }
    .strand { white-space: pre; font-size: 17px; line-height: 21px; text-align: center; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.32) 44%, rgba(0,0,0,1) 100%); mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.32) 44%, rgba(0,0,0,1) 100%); }
    .head { font-size: 17px; line-height: 21px; }
    .cell { position: relative; display: inline-block; }
    .strut { visibility: hidden; }
    .cyc { position: absolute; left: 0; right: 0; top: 0; text-align: center; animation: swap 0.42s steps(1, end) infinite; }
    @keyframes fall { from { transform: translateY(-460px); } to { transform: translateY(520px); } }
    @keyframes swap { 0%, 32% { opacity: 1; } 33%, 100% { opacity: 0; } }
  </style>
</helmet>
<div style="width: 520px; height: 520px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 28%, #2b2f2d 0%, #161918 55%, #070807 100%);">
  <div style="position: relative; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; background: #000000; box-shadow: inset 0 0 0 2px #191c1b;">
    <div style="position: absolute; inset: 0; color: {{dim}};">
      <sc-for list="{{cols}}" as="col" hint-placeholder-count="10">
        <div class="col" style="left: {{col.left}}px; animation-duration: {{col.dur}}s; animation-delay: {{col.delay}}s; opacity: {{col.op}};">
          <span class="strand">{{col.text}}</span>
          <span class="head" style="color: {{headC}}; text-shadow: 0 0 12px {{accent}};">{{col.head}}</span>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 48% 38% at 50% 50%, rgba(0,0,0,0.94) 0%, rgba(0,0,0,0.8) 52%, rgba(0,0,0,0) 100%);"></div>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 14px; padding: 44px 80px;">
      <div style="font-size: 22px; letter-spacing: 2px; color: {{labelC}};">&gt; DECRYPT.TIME</div>
      <div style="display: flex; align-items: baseline; font-size: 80px; line-height: 0.95;">
        <span style="color: {{accent}}; text-shadow: 0 0 14px {{glow1}}, 0 0 40px {{glow2}};">10:0</span>
        <span class="cell"><span class="strut">0</span><sc-for list="{{scramble}}" as="s" hint-placeholder-count="3"><span class="cyc" style="color: {{s.color}}; animation-delay: {{s.delay}}s;">{{s.ch}}</span></sc-for></span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 2px;">
        <div style="position: relative; width: 210px; height: 6px; background: {{trackC}};">
          <div style="position: absolute; left: 0; top: 0; height: 6px; width: 132px; background: {{accent}}; box-shadow: 0 0 10px {{glow1}};"></div>
        </div>
        <span style="font-size: 22px; color: {{valueC}};">63%</span>
      </div>
      <div style="font-size: 24px; letter-spacing: 1px; color: {{valueC}}; margin-top: 6px;">THU 10 SEP / 8670</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":520,"height":520},"accent":{"editor":"color","default":"#ff2d2d","options":["#ff2d2d","#ff6b6b","#ff8b3d","#ff2d8b"]},"speed":{"editor":"range","default":1,"min":0.3,"max":2.5,"step":0.1}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent || '#ff2d2d';
    var speed = this.props.speed || 1;
    var density = 28;
    var G = [];
    for (var c = 0xff66; c <= 0xff9d; c++) G.push(String.fromCharCode(c));
    G = G.concat('0123456789=+*'.split(''));
    function rnd(s) { var x = Math.sin(s * 63.1) * 27183.3391; return x - Math.floor(x); }
    function rgba(hex, a) {
      var h = String(hex).replace('#', '');
      if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
      var n = parseInt(h, 16);
      if (isNaN(n)) n = 0xff2d2d;
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }
    var cols = [];
    var step = 480 / density;
    for (var i = 0; i < density; i++) {
      var len = 8 + Math.floor(rnd(i + 1) * 12);
      var t = [];
      for (var j = 0; j < len; j++) t.push(G[Math.floor(rnd(i * 21.7 + j * 8.3 + 6) * G.length)]);
      cols.push({
        left: Math.round(i * step + (rnd(i + 9) - 0.5) * step * 0.45),
        text: t.join('\n'),
        head: G[Math.floor(rnd(i * 7.1 + 17) * G.length)],
        dur: Math.round((5.5 + rnd(i + 5) * 8) / speed * 10) / 10,
        delay: -Math.round(rnd(i + 2) * 130) / 10,
        op: Math.round((0.4 + rnd(i + 7) * 0.5) * 100) / 100
      });
    }
    var scramble = [];
    for (var k = 0; k < 3; k++) {
      scramble.push({
        ch: G[Math.floor(rnd(k * 3.7 + 29) * G.length)],
        color: rgba(accent, 0.55),
        delay: Math.round(k * 14) / 100
      });
    }
    return {
      accent: accent,
      dim: rgba(accent, 0.7),
      headC: '#fff0f0',
      labelC: rgba(accent, 0.45),
      valueC: rgba(accent, 0.85),
      trackC: rgba(accent, 0.2),
      glow1: rgba(accent, 0.85),
      glow2: rgba(accent, 0.4),
      cols: cols,
      scramble: scramble
    };
  }
}
</script>
</body>
</html>
